<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAE — Sistema Apollo Enterprise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
/* ===== RESET & BASE ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg-base: #0f172a;
  --bg-surface: rgba(15, 23, 42, 0.92);
  --bg-card: rgba(30, 41, 59, 0.88);
  --bg-card-hover: rgba(51, 65, 85, 0.96);
  --bg-glass: rgba(255,255,255,0.09);
  --bg-glass-hover: rgba(255,255,255,0.14);
  --border: rgba(255,255,255,0.16);
  --border-accent: rgba(99,102,241,0.4);
  --text-primary: #f1f5f9;
  --text-secondary: #cbd5e1;
  --text-muted: #b8c5d6;
  --accent: #6366f1;
  --accent-2: #8b5cf6;
  --accent-glow: rgba(99,102,241,0.15);
  --teal: #14b8a6;
  --amber: #f59e0b;
  --emerald: #10b981;
  --rose: #f43f5e;
  --cyan: #06b6d4;
  --font-head: 'Roboto', sans-serif;
  --font-body: 'Roboto', sans-serif;
  --sidebar-w: 260px;
  --radius: 12px;
  --radius-lg: 18px;
  --radius-xl: 24px;
  --blur: blur(20px);
  --shadow: 0 8px 32px rgba(0,0,0,0.4);
  --shadow-sm: 0 2px 12px rgba(0,0,0,0.3);
  --mesh-1: rgba(99,102,241,0.12);
  --mesh-2: rgba(139,92,246,0.1);
  --mesh-3: rgba(20,184,166,0.06);
  --sidebar-bg: rgba(15,23,42,0.95);
  --topbar-bg: rgba(15,23,42,0.7);
}

[data-theme="light"] {
  --bg-base: #f8fafc;
  --bg-surface: rgba(255, 255, 255, 0.96);
  --bg-card: rgba(255, 255, 255, 0.95);
  --bg-card-hover: rgba(255, 255, 255, 1);
  --bg-glass: rgba(15, 23, 42, 0.05);
  --bg-glass-hover: rgba(15, 23, 42, 0.1);
  --border: rgba(15, 23, 42, 0.16);
  --border-accent: rgba(79, 70, 229, 0.35);
  --text-primary: #0f172a;
  --text-secondary: #334155;
  --text-muted: #475569;
  --accent-glow: rgba(79,70,229,0.12);
  --shadow: 0 10px 30px rgba(15,23,42,0.12);
  --shadow-sm: 0 4px 18px rgba(15,23,42,0.14);
  --mesh-1: rgba(79,70,229,0.15);
  --mesh-2: rgba(147,51,234,0.1);
  --mesh-3: rgba(6,182,212,0.08);
  --sidebar-bg: rgba(255,255,255,0.94);
  --topbar-bg: rgba(255,255,255,0.88);
}
html, body { height: 100%; overflow: hidden; }
body {
  font-family: var(--font-body);
  background: var(--bg-base);
  color: var(--text-primary);
  font-size: 14px;
  line-height: 1.6;
}

/* ===== BACKGROUND MESH ===== */
.bg-mesh {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(ellipse 80% 60% at 20% 10%, var(--mesh-1) 0%, transparent 60%),
    radial-gradient(ellipse 60% 50% at 80% 80%, var(--mesh-2) 0%, transparent 60%),
    radial-gradient(ellipse 50% 40% at 50% 40%, var(--mesh-3) 0%, transparent 60%),
    var(--bg-base);
}

/* ===== APP LAYOUT ===== */
#app { display: flex; height: 100vh; width: 100%; position: relative; z-index: 1; overflow: hidden; }

/* ===== SIDEBAR ===== */
.sidebar {
  width: var(--sidebar-w);
  min-width: var(--sidebar-w);
  height: 100vh;
  background: var(--sidebar-bg);
  backdrop-filter: var(--blur);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  padding: 0;
  position: relative;
  z-index: 10;
  flex-shrink: 0;
}
.sidebar-header {
  padding: 24px 20px 20px;
  border-bottom: 1px solid var(--border);
}
.logo {
  display: flex; align-items: center; gap: 12px; margin-bottom: 4px;
}
.logo-icon {
  width: 38px; height: 38px; border-radius: 10px;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; flex-shrink: 0;
  box-shadow: 0 0 20px rgba(99,102,241,0.3);
}
.logo-text { line-height: 1.2; }
.logo-name { font-family: var(--font-head); font-size: 18px; font-weight: 800; letter-spacing: -0.5px; }
.logo-sub { font-size: 10px; color: var(--text-muted); letter-spacing: 0.5px; text-transform: uppercase; }
.user-chip {
  margin-top: 14px; padding: 8px 10px;
  background: var(--bg-glass); border-radius: 8px; border: 1px solid var(--border);
  display: flex; align-items: center; gap: 8px; cursor: pointer;
  transition: background 0.2s;
}
.user-chip:hover { background: var(--bg-glass-hover); }
.avatar {
  width: 28px; height: 28px; border-radius: 50%;
  background: linear-gradient(135deg, #6366f1, #8b5cf6);
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700; flex-shrink: 0;
}
.user-info { flex: 1; overflow: hidden; }
.user-name { font-size: 12px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.user-plan { font-size: 10px; color: var(--accent); letter-spacing: 0.3px; }
.plan-badge {
  font-size: 9px; padding: 2px 6px; border-radius: 4px;
  background: rgba(99,102,241,0.2); color: var(--accent); border: 1px solid rgba(99,102,241,0.3);
  font-weight: 600; letter-spacing: 0.3px;
}

.sidebar-nav {
  flex: 1; overflow-y: auto; padding: 12px 10px;
  scrollbar-width: none;
}
.sidebar-nav::-webkit-scrollbar { display: none; }
.nav-section-label {
  font-size: 9px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase;
  color: var(--text-muted); padding: 12px 10px 6px;
}
.nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 12px; border-radius: 8px; cursor: pointer;
  transition: all 0.15s; position: relative; margin-bottom: 2px;
  color: var(--text-secondary); font-size: 13px; font-weight: 400;
  user-select: none;
}
.nav-item:hover { background: var(--bg-glass); color: var(--text-primary); }
.nav-item.disabled { opacity: .45; cursor: not-allowed; pointer-events: none; }
.nav-item.active {
  background: var(--accent-glow); color: var(--text-primary);
  border: 1px solid var(--border-accent);
}
.nav-item.active::before {
  content: ''; position: absolute; left: 0; top: 50%; transform: translateY(-50%);
  width: 3px; height: 18px; background: var(--accent); border-radius: 0 3px 3px 0;
}
.nav-icon { font-size: 16px; width: 20px; text-align: center; flex-shrink: 0; }
.nav-badge {
  margin-left: auto; font-size: 9px; font-weight: 700;
  background: var(--accent); color: white; border-radius: 10px;
  padding: 1px 6px; min-width: 18px; text-align: center;
}

.sidebar-footer {
  padding: 12px 10px; border-top: 1px solid var(--border);
}
.apollo-mascot {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px; border-radius: 8px;
  background: linear-gradient(135deg, rgba(99,102,241,0.1), rgba(139,92,246,0.1));
  border: 1px solid rgba(99,102,241,0.2);
  cursor: pointer;
}
.mascot-img { font-size: 22px; }
.mascot-text { font-size: 11px; }
.mascot-name { font-weight: 600; color: var(--accent); }
.mascot-status { color: var(--text-muted); }

/* ===== MAIN CONTENT ===== */
.main {
  flex: 1; display: flex; flex-direction: column;
  height: 100vh; overflow: hidden;
}
.topbar {
  height: 58px; min-height: 58px;
  background: var(--topbar-bg); backdrop-filter: var(--blur);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; padding: 0 24px; gap: 16px;
  z-index: 5;
}
.topbar-title {
  font-family: var(--font-head); font-size: 16px; font-weight: 700; flex: 1;
}
.topbar-actions { display: flex; gap: 8px; align-items: center; }
.btn {
  padding: 7px 14px; border-radius: 8px; border: none; cursor: pointer;
  font-family: var(--font-body); font-size: 12px; font-weight: 500;
  transition: all 0.15s; display: flex; align-items: center; gap: 6px;
}
.btn-primary {
  background: var(--accent); color: white;
  box-shadow: 0 0 15px rgba(99,102,241,0.25);
}
.btn-primary:hover { background: #4f46e5; box-shadow: 0 0 20px rgba(99,102,241,0.4); }
.btn-ghost {
  background: var(--bg-glass); color: var(--text-secondary);
  border: 1px solid var(--border);
}
.btn-ghost:hover { background: var(--bg-glass-hover); color: var(--text-primary); }
.btn-danger { background: rgba(244,63,94,0.15); color: var(--rose); border: 1px solid rgba(244,63,94,0.3); }
.btn-success { background: rgba(16,185,129,0.15); color: var(--emerald); border: 1px solid rgba(16,185,129,0.3); }
.btn-sm { padding: 5px 10px; font-size: 11px; }

.content {
  flex: 1; overflow-y: auto; padding: 24px;
  scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.2) transparent;
}
.content::-webkit-scrollbar { width: 4px; }
.content::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 2px; }

.content > div {
  position: relative;
  z-index: 2;
}

.content .card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  color: var(--text-primary);
  box-shadow: var(--shadow-sm);
}

/* ===== GLASS CARDS ===== */
.card {
  background: var(--bg-card);
  backdrop-filter: var(--blur);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 20px;
  transition: border-color 0.2s, background 0.2s;
}
.card:hover { border-color: rgba(255,255,255,0.12); background: var(--bg-card-hover); }
.card-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 16px;
}
.card-title {
  font-family: var(--font-head); font-size: 14px; font-weight: 700;
  display: flex; align-items: center; gap: 8px;
}
.card-icon { font-size: 16px; }

/* ===== KPI GRID ===== */
.kpi-grid {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px;
  margin-bottom: 24px;
}
.kpi-card {
  background: var(--bg-card);
  backdrop-filter: var(--blur);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px 20px;
  position: relative; overflow: hidden;
  transition: all 0.2s;
}
.kpi-card:hover { transform: translateY(-2px); border-color: rgba(255,255,255,0.15); }
.kpi-card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
}
.kpi-card.accent::before { background: linear-gradient(90deg, var(--accent), var(--accent-2)); }
.kpi-card.teal::before { background: linear-gradient(90deg, var(--teal), #0891b2); }
.kpi-card.amber::before { background: linear-gradient(90deg, var(--amber), #f97316); }
.kpi-card.emerald::before { background: linear-gradient(90deg, var(--emerald), var(--teal)); }
.kpi-label { font-size: 11px; color: var(--text-muted); letter-spacing: 0.5px; margin-bottom: 8px; text-transform: uppercase; }
.kpi-value { font-family: var(--font-head); font-size: 28px; font-weight: 800; line-height: 1; margin-bottom: 6px; }
.kpi-delta { font-size: 11px; display: flex; align-items: center; gap: 4px; }
.kpi-delta.up { color: var(--emerald); }
.kpi-delta.down { color: var(--rose); }
.kpi-icon { position: absolute; top: 18px; right: 18px; font-size: 22px; opacity: 0.3; }

/* ===== CHARTS GRID ===== */
.charts-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 14px;
  margin-bottom: 24px;
}
.chart-box { position: relative; width: 100%; height: 260px; overflow: hidden; }
.chart-box canvas { width: 100% !important; height: 100% !important; display: block; }

/* ===== DATA TABLE ===== */
.table-wrap { overflow-x: auto; margin-top: 8px; }
table { width: 100%; border-collapse: collapse; }
th {
  text-align: left; padding: 8px 12px;
  font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
  color: var(--text-muted); border-bottom: 1px solid var(--border);
}
td {
  padding: 10px 12px; border-bottom: 1px solid rgba(255,255,255,0.04);
  font-size: 13px; color: var(--text-secondary);
}
tr:hover td { background: var(--bg-glass); color: var(--text-primary); }
tr:last-child td { border-bottom: none; }
.status-badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 3px 9px; border-radius: 20px; font-size: 10px; font-weight: 600;
}
.status-active { background: rgba(16,185,129,0.15); color: var(--emerald); border: 1px solid rgba(16,185,129,0.25); }
.status-pending { background: rgba(245,158,11,0.15); color: var(--amber); border: 1px solid rgba(245,158,11,0.25); }
.status-paused { background: rgba(148,163,184,0.1); color: var(--text-muted); border: 1px solid rgba(148,163,184,0.15); }
.status-done { background: rgba(99,102,241,0.15); color: var(--accent); border: 1px solid rgba(99,102,241,0.25); }

/* ===== SECTION GRID ===== */
.section-grid { display: grid; grid-template-columns: 1fr; gap: 14px; }
.two-col { grid-template-columns: 1fr 1fr; }
.three-col { grid-template-columns: repeat(3, 1fr); }

/* ===== MODALS ===== */
.modal-overlay {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(0,0,0,0.7); backdrop-filter: blur(4px);
  display: flex; align-items: center; justify-content: center; padding: 20px;
}
.modal {
  background: var(--bg-card); color: var(--text-primary);
  border: 1px solid var(--border);
  border-radius: var(--radius-xl); padding: 28px;
  width: 100%; max-width: 520px; max-height: 85vh;
  overflow-y: auto;
  box-shadow: var(--shadow);
  backdrop-filter: var(--blur);
  animation: modalIn 0.2s ease;
}
.modal-lg { max-width: 700px; }
@keyframes modalIn { from { opacity: 0; transform: scale(0.96) translateY(10px); } }
.modal-header {
  display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px;
}
.modal-title { font-family: var(--font-head); font-size: 18px; font-weight: 800; }
.modal .modal-title { color: var(--text-primary); }
.modal .form-label { color: var(--text-secondary); font-weight: 500; }
.modal .form-input,
.modal .form-select,
.modal .form-textarea {
  background: var(--bg-glass);
  border: 1px solid var(--border);
  color: var(--text-primary);
  border-radius: var(--radius);
}
.modal-close {
  width: 30px; height: 30px; border-radius: 8px; border: none;
  background: var(--bg-glass); color: var(--text-secondary); cursor: pointer;
  display: flex; align-items: center; justify-content: center; font-size: 16px;
  transition: all 0.15s;
}
.modal-close:hover { background: rgba(244,63,94,0.2); color: var(--rose); }

/* ===== FORMS ===== */
.form-group { margin-bottom: 16px; }
.form-label {
  display: block; font-size: 11px; font-weight: 600; letter-spacing: 0.5px;
  text-transform: uppercase; color: var(--text-muted); margin-bottom: 6px;
}
.form-input, .form-select, .form-textarea {
  width: 100%; padding: 9px 12px; border-radius: 8px;
  border: 1px solid var(--border); background: var(--bg-glass);
  color: var(--text-primary); font-family: var(--font-body); font-size: 13px;
  outline: none; transition: border-color 0.15s, box-shadow 0.15s;
  -webkit-appearance: none;
}
.form-input:focus, .form-select:focus, .form-textarea:focus {
  border-color: var(--accent); box-shadow: 0 0 0 3px rgba(99,102,241,0.15);
}
.form-textarea { resize: vertical; min-height: 80px; }
.form-select option { background: var(--bg-card); color: var(--text-primary); }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.form-footer { display: flex; gap: 10px; justify-content: flex-end; margin-top: 22px; }
.form-divider { height: 1px; background: var(--border); margin: 18px 0; }

/* ===== KANBAN ===== */
.kanban-board {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px;
  min-height: 400px;
}
.kanban-col {
  background: var(--bg-surface);
  border: 1px solid var(--border); border-radius: var(--radius-lg);
  display: flex; flex-direction: column;
}
.kanban-header {
  padding: 12px 14px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}
.kanban-col-title {
  font-size: 11px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase;
  display: flex; align-items: center; gap: 6px;
}
.col-dot { width: 8px; height: 8px; border-radius: 50%; }
.col-iniciar .col-dot { background: var(--text-muted); }
.col-execucao .col-dot { background: var(--accent); }
.col-validando .col-dot { background: var(--amber); }
.col-concluido .col-dot { background: var(--emerald); }
.kanban-count {
  font-size: 10px; padding: 2px 7px; border-radius: 10px;
  background: var(--bg-glass); color: var(--text-muted); border: 1px solid var(--border);
}
.kanban-cards { padding: 10px; flex: 1; display: flex; flex-direction: column; gap: 8px; min-height: 80px; }
.task-card {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 12px;
  cursor: pointer; transition: all 0.15s;
  color: var(--text-primary);
}
.task-card:hover { border-color: rgba(255,255,255,0.15); transform: translateY(-1px); box-shadow: var(--shadow-sm); }
.task-title { font-size: 12px; font-weight: 500; margin-bottom: 6px; line-height: 1.4; }
.task-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.task-tag {
  font-size: 9px; padding: 2px 7px; border-radius: 6px; font-weight: 600;
  background: rgba(99,102,241,0.15); color: var(--accent); border: 1px solid rgba(99,102,241,0.2);
}
.task-due { font-size: 10px; color: var(--text-muted); }
.task-due.overdue { color: var(--rose); }
.task-responsible {
  margin-left: auto; font-size: 9px;
  background: var(--bg-glass); padding: 2px 8px; border-radius: 6px;
  color: var(--text-muted); border: 1px solid var(--border);
}
.add-task-btn {
  margin: 0 10px 10px; padding: 8px; border-radius: 8px; border: none;
  background: var(--bg-glass); color: var(--text-muted); cursor: pointer;
  font-size: 11px; transition: all 0.15s; width: calc(100% - 20px);
  display: flex; align-items: center; justify-content: center; gap: 4px;
}
.add-task-btn:hover { background: var(--accent-glow); color: var(--accent); }

/* ===== DIAGNÓSTICO RADAR ===== */
.diagnostico-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.score-list { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
.score-item { display: flex; align-items: center; gap: 10px; }
.score-label { font-size: 12px; color: var(--text-secondary); width: 100px; flex-shrink: 0; }
.score-bar { flex: 1; height: 6px; background: rgba(255,255,255,0.06); border-radius: 3px; overflow: hidden; }
.score-fill { height: 100%; border-radius: 3px; transition: width 0.8s ease; }
.score-val { font-size: 12px; font-weight: 600; width: 36px; text-align: right; }

/* ===== PORTAL CLIENTE ===== */
.portal-header {
  text-align: center; padding: 32px 24px;
  background: linear-gradient(135deg, rgba(99,102,241,0.1), rgba(139,92,246,0.1));
  border: 1px solid rgba(99,102,241,0.2); border-radius: var(--radius-xl);
  margin-bottom: 20px;
}
.portal-company { font-family: var(--font-head); font-size: 24px; font-weight: 800; }
.portal-subtitle { color: var(--text-muted); margin-top: 4px; }
.progress-circle-wrap { display: flex; align-items: center; gap: 24px; padding: 12px 0; }
.progress-bar-lg { height: 8px; background: rgba(255,255,255,0.06); border-radius: 4px; overflow: hidden; margin-top: 8px; }
.progress-fill { height: 100%; border-radius: 4px; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width 0.8s ease; }

/* ===== FINANCEIRO ===== */
.fin-summary {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 20px;
}
.fin-card {
  border-radius: var(--radius); padding: 16px; text-align: center;
  border: 1px solid var(--border);
}
.fin-card.receita { background: rgba(16,185,129,0.08); border-color: rgba(16,185,129,0.2); }
.fin-card.inadimplente { background: rgba(244,63,94,0.08); border-color: rgba(244,63,94,0.2); }
.fin-card.total { background: rgba(99,102,241,0.08); border-color: rgba(99,102,241,0.2); }
.fin-value { font-family: var(--font-head); font-size: 24px; font-weight: 800; margin-top: 4px; }
.fin-card.receita .fin-value { color: var(--emerald); }
.fin-card.inadimplente .fin-value { color: var(--rose); }
.fin-card.total .fin-value { color: var(--accent); }

/* ===== LOGIN ===== */
.login-wrap {
  display: flex; align-items: center; justify-content: center;
  flex: 1; width: 100%;
  min-height: 100vh; padding: 20px;
  background:
    radial-gradient(ellipse 60% 50% at 30% 20%, var(--mesh-1) 0%, transparent 60%),
    radial-gradient(ellipse 50% 40% at 70% 80%, var(--mesh-2) 0%, transparent 60%),
    var(--bg-base);
}
.login-box {
  width: 100%; max-width: 420px;
  background: var(--bg-card); backdrop-filter: var(--blur);
  border: 1px solid var(--border); border-radius: var(--radius-xl);
  padding: 40px; box-shadow: 0 32px 80px rgba(0,0,0,0.5);
}
.login-logo { text-align: center; margin-bottom: 32px; }
.login-apollo { font-size: 48px; display: block; margin-bottom: 10px; filter: drop-shadow(0 0 15px rgba(99,102,241,0.5)); }
.login-title { font-family: var(--font-head); font-size: 22px; font-weight: 800; }
.login-sub { color: var(--text-muted); font-size: 13px; margin-top: 4px; }
.auth-switch { display: flex; gap: 8px; margin-bottom: 14px; }
.auth-switch .btn { flex: 1; justify-content: center; }
.login-btn {
  width: 100%; padding: 12px; border: none; border-radius: 10px;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  color: white; font-family: var(--font-head); font-size: 15px; font-weight: 700;
  cursor: pointer; transition: all 0.2s; letter-spacing: 0.3px;
  box-shadow: 0 4px 20px rgba(99,102,241,0.3);
}
.login-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(99,102,241,0.4); }
.login-divider { text-align: center; color: var(--text-muted); font-size: 12px; margin: 18px 0; }

.login-actions { display:flex; justify-content:space-between; gap:8px; margin-top:10px; }
.login-link-btn {
  background: transparent; border: none; color: var(--accent); cursor: pointer;
  font-size: 12px; font-weight: 500; padding: 0;
}
.login-link-btn:hover { text-decoration: underline; }


/* ===== SKELETON ===== */
.skeleton {
  background: linear-gradient(90deg, rgba(255,255,255,0.04) 25%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.04) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.5s infinite;
  border-radius: 6px;
}
@keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
.sk-line { height: 12px; margin-bottom: 8px; }
.sk-title { height: 18px; width: 60%; margin-bottom: 16px; }
.sk-card { height: 80px; border-radius: var(--radius); margin-bottom: 10px; }

/* ===== LOADING OVERLAY ===== */
.loading-overlay {
  position: fixed; inset: 0; z-index: 200;
  background: var(--sidebar-bg); backdrop-filter: var(--blur);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
}
.loading-mascot { font-size: 64px; animation: bounce 0.8s ease-in-out infinite alternate; }
@keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-12px); } }
.loading-text { font-family: var(--font-head); font-size: 16px; color: var(--text-secondary); }
.loading-dots { display: flex; gap: 6px; }
.loading-dot {
  width: 8px; height: 8px; border-radius: 50%; background: var(--accent);
  animation: pulse 0.9s ease-in-out infinite;
}
.loading-dot:nth-child(2) { animation-delay: 0.15s; background: var(--accent-2); }
.loading-dot:nth-child(3) { animation-delay: 0.3s; background: var(--teal); }
@keyframes pulse { 0%,100%{ opacity:0.3; transform:scale(0.8); } 50%{ opacity:1; transform:scale(1.2); } }

/* ===== TOAST ===== */
.toast-stack {
  position: fixed; right: 16px; top: 16px; z-index: 400;
  display: flex; flex-direction: column; gap: 8px; max-width: 360px;
}
.toast {
  border-radius: 10px; padding: 10px 12px;
  border: 1px solid var(--border);
  background: var(--bg-surface);
  color: var(--text-primary); font-size: 12px;
  box-shadow: var(--shadow-sm);
}
.toast.success { border-color: rgba(16,185,129,0.5); color: #6ee7b7; }
.toast.error { border-color: rgba(244,63,94,0.5); color: #fda4af; }
.toast.info { border-color: rgba(6,182,212,0.5); color: #67e8f9; }

/* ===== SYSTEM MODAL ===== */
.system-modal-overlay {
  position: fixed; inset: 0; z-index: 420;
  background: rgba(2,6,23,0.65); backdrop-filter: blur(8px);
  display: flex; align-items: center; justify-content: center;
}
.system-modal {
  width: min(92vw, 420px);
  background: var(--sidebar-bg);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 18px;
  box-shadow: var(--shadow);
}
.system-modal h4 { margin: 0 0 10px; font-size: 14px; }
.system-modal p { margin: 0 0 14px; font-size: 12px; color: var(--text-secondary); }

/* ===== TABS ===== */
.tabs { display: flex; gap: 2px; background: var(--bg-glass); border: 1px solid var(--border); border-radius: 10px; padding: 4px; margin-bottom: 18px; width: fit-content; }
.tab {
  padding: 7px 16px; border-radius: 7px; border: none; cursor: pointer;
  font-family: var(--font-body); font-size: 12px; font-weight: 500;
  color: var(--text-muted); background: transparent; transition: all 0.15s;
}
.tab.active { background: var(--bg-card); color: var(--text-primary); box-shadow: var(--shadow-sm); }
.tab:hover:not(.active) { color: var(--text-secondary); }

/* ===== TOOLTIP / EMPTY ===== */
.empty-state {
  text-align: center; padding: 40px 20px; color: var(--text-muted);
}
.empty-icon { font-size: 36px; margin-bottom: 10px; opacity: 0.5; }
.empty-text { font-size: 13px; }

/* ===== SCROLLBAR ===== */
* { scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.2) transparent; }
*::-webkit-scrollbar { width: 4px; height: 4px; }
*::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 2px; }

/* ===== RESPONSIVE ===== */
@media (max-width: 1100px) {
  .kpi-grid { grid-template-columns: repeat(2, 1fr); }
  .kanban-board { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 768px) {
  :root { --sidebar-w: 0px; }
  .sidebar { display: none; }
  .kpi-grid { grid-template-columns: 1fr 1fr; }
  .charts-grid { grid-template-columns: 1fr; }
  .kanban-board { grid-template-columns: 1fr; }
  .diagnostico-grid { grid-template-columns: 1fr; }
  .fin-summary { grid-template-columns: 1fr; }
  .form-row { grid-template-columns: 1fr; }
}
/* Tag de seção */
.section-tag {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
  padding: 4px 10px; border-radius: 20px; margin-bottom: 16px;
  background: var(--accent-glow); color: var(--accent); border: 1px solid var(--border-accent);
}
.page-title { font-family: var(--font-head); font-size: 22px; font-weight: 800; margin-bottom: 4px; }
.page-sub { color: var(--text-muted); font-size: 13px; margin-bottom: 24px; }
</style>
</head>
<body>
<div id="app">
  <div class="bg-mesh"></div>

  <!-- LOADING OVERLAY (Apollo Mascote) -->
  <transition name="fade">
    <div class="loading-overlay" v-if="loading">
      <div class="loading-mascot">🐾</div>
      <div class="loading-text">Apollo está trabalhando...</div>
      <div class="loading-dots">
        <div class="loading-dot"></div>
        <div class="loading-dot"></div>
        <div class="loading-dot"></div>
      </div>
    </div>
  </transition>

  <div class="toast-stack" v-if="toasts.length">
    <div class="toast" :class="t.tipo" v-for="t in toasts" :key="t.id">{{ t.msg }}</div>
  </div>

  <div class="system-modal-overlay" v-if="systemModal.open" @click.self="closeSystemModal">
    <div class="system-modal">
      <h4>{{ systemModal.title }}</h4>
      <p>{{ systemModal.message }}</p>
      <div style="display:flex;justify-content:flex-end;">
        <button class="btn btn-primary" @click="closeSystemModal">OK</button>
      </div>
    </div>
  </div>

  <!-- LOGIN -->
  <div class="login-wrap" v-if="appState!=='authenticated'">
    <div class="login-box">
      <div style="display:flex;justify-content:flex-end;margin-bottom:10px;">
        <button class="btn btn-ghost btn-sm" @click="toggleTheme">{{ currentTheme==='dark' ? '☀️ Tema claro' : '🌙 Tema escuro' }}</button>
      </div>
      <div class="login-logo">
        <span class="login-apollo">🐾</span>
        <div class="login-title">SAE</div>
        <div class="login-sub">Sistema Apollo Enterprise</div>
      </div>
      <div class="auth-switch">
        <button class="btn" :class="authMode==='login' ? 'btn-primary' : 'btn-ghost'" @click="authMode='login'">Entrar</button>
        <button class="btn" :class="authMode==='signup' ? 'btn-primary' : 'btn-ghost'" @click="authMode='signup'">Criar conta</button>
      </div>

      <template v-if="authMode==='login'">
        <div class="form-group">
          <label class="form-label">Email do Consultor</label>
          <input class="form-input" type="email" v-model="loginEmail" placeholder="seu@email.com" @keyup.enter="doLogin">
        </div>
        <div class="form-group">
          <label class="form-label">Senha</label>
          <input class="form-input" type="password" v-model="loginPass" placeholder="••••••••" @keyup.enter="doLogin">
        </div>
      </template>

      <template v-else-if="authMode==='forgot'">
        <div class="form-group">
          <label class="form-label">E-mail cadastrado</label>
          <input class="form-input" type="email" v-model="resetEmail" placeholder="seu@email.com" @keyup.enter="requestPasswordReset">
        </div>
      </template>

      <template v-else-if="authMode==='reset'">
        <div class="form-group">
          <label class="form-label">Código de recuperação</label>
          <input class="form-input" type="text" v-model="resetToken" placeholder="Cole o código recebido por e-mail">
        </div>
        <div class="form-group">
          <label class="form-label">Nova senha</label>
          <input class="form-input" type="password" v-model="resetPass" placeholder="Mínimo 6 caracteres" @keyup.enter="confirmPasswordReset">
        </div>
        <div class="form-group">
          <label class="form-label">Confirmar nova senha</label>
          <input class="form-input" type="password" v-model="resetPassConfirm" placeholder="Repita a nova senha" @keyup.enter="confirmPasswordReset">
        </div>
      </template>

      <template v-else>
        <div class="form-group">
          <label class="form-label">Nome</label>
          <input class="form-input" type="text" v-model="signupNome" placeholder="Seu nome completo">
        </div>
        <div class="form-group">
          <label class="form-label">Email</label>
          <input class="form-input" type="email" v-model="signupEmail" placeholder="seu@email.com">
        </div>
        <div class="form-group">
          <label class="form-label">Senha</label>
          <input class="form-input" type="password" v-model="signupPass" placeholder="Mínimo 6 caracteres">
        </div>
      </template>

      <div style="color: var(--text-secondary); font-size: 12px; margin-bottom: 12px;" v-if="appState==='booting'">Validando sessão...</div>
      <div style="color: var(--rose); font-size: 12px; margin-bottom: 12px;" v-if="loginError">{{ loginError }}</div>
      <button class="login-btn" @click="submitAuth()" :disabled="appState==='booting'">
        {{ authPrimaryButtonLabel }}
      </button>
      <div class="login-actions">
        <button class="login-link-btn" v-if="authMode==='login'" @click="authMode='forgot'">Esqueci minha senha</button>
        <button class="login-link-btn" v-if="authMode==='forgot'" @click="authMode='reset'">Já tenho o código</button>
        <button class="login-link-btn" v-if="authMode==='forgot' || authMode==='reset'" @click="authMode='login'">Voltar ao login</button>
      </div>
      <button class="btn btn-ghost" style="width:100%; justify-content:center; margin-top:8px;" @click="runSetup" v-if="showSetupAction">
        🛠️ Executar setupSpreadsheet()
      </button>
      <p style="text-align:center; color:var(--text-muted); font-size:10px; margin-top:16px;">
        Dados protegidos por SHA-256 · Multi-tenant isolado por consultor
      </p>
    </div>
  </div>

  <!-- MAIN APP -->
  <template v-else>
    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <div class="logo-icon">🐾</div>
          <div class="logo-text">
            <div class="logo-name">SAE</div>
            <div class="logo-sub">Apollo Enterprise</div>
          </div>
        </div>
        <div class="user-chip">
          <div class="avatar">{{ user.initials }}</div>
          <div class="user-info">
            <div class="user-name">{{ user.nome }}</div>
            <div class="user-plan">Plano {{ user.plano }}</div>
          </div>
          <span class="plan-badge">{{ String(user.plano || 'Pro').toUpperCase() }}</span>
        </div>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-section-label">Principal</div>
        <div class="nav-item" :class="{active: currentPage==='dashboard', disabled: !canAccessPage('dashboard')}" @click="navigate('dashboard')">
          <span class="nav-icon">📊</span> Dashboard
        </div>
        <div class="nav-item" :class="{active: currentPage==='clientes', disabled: !canAccessPage('clientes')}" @click="navigate('clientes')">
          <span class="nav-icon">🏢</span> Clientes
          <span class="nav-badge" v-if="clientes.length">{{ clientes.length }}</span>
        </div>

        <div class="nav-section-label">Ferramentas</div>
        <div class="nav-item" :class="{active: currentPage==='diagnostico', disabled: !canAccessPage('diagnostico')}" @click="navigate('diagnostico')">
          <span class="nav-icon">🔍</span> Diagnóstico
        </div>
        <div class="nav-item" :class="{active: currentPage==='projetos', disabled: !canAccessPage('projetos')}" @click="navigate('projetos')">
          <span class="nav-icon">📋</span> Projetos 5W2H
        </div>
        <div class="nav-item" :class="{active: currentPage==='financeiro', disabled: !canAccessPage('financeiro')}" @click="navigate('financeiro')">
          <span class="nav-icon">💰</span> Financeiro
        </div>

        <div class="nav-section-label">Portal</div>
        <div class="nav-item" :class="{active: currentPage==='portal', disabled: !canAccessPage('portal')}" @click="navigate('portal')">
          <span class="nav-icon">🌐</span> Portal do Cliente
        </div>
        <div class="nav-item" :class="{active: currentPage==='relatorios', disabled: !canAccessPage('relatorios')}" @click="navigate('relatorios')">
          <span class="nav-icon">📄</span> Relatórios
        </div>

        <div class="nav-section-label">Sistema</div>
        <div class="nav-item" :class="{active: currentPage==='configuracoes', disabled: !canAccessPage('configuracoes')}" @click="navigate('configuracoes')">
          <span class="nav-icon">⚙️</span> Configurações
        </div>

        <div class="nav-item" v-if="canAccessPage('admin')" :class="{active: currentPage==='admin'}" @click="navigate('admin')">
          <span class="nav-icon">🛡️</span> Admin Enterprise
        </div>

      </nav>

      <div class="sidebar-footer">
        <div class="apollo-mascot">
          <span class="mascot-img">🐾</span>
          <div class="mascot-text">
            <div class="mascot-name">Apollo</div>
            <div class="mascot-status">Sistema operacional</div>
          </div>
        </div>
      </div>
    </aside>

    <!-- MAIN -->
    <main class="main">
      <!-- TOPBAR -->
      <div class="topbar">
        <div class="topbar-title">{{ pageTitle }}</div>
        <div class="topbar-actions">
          <template v-if="currentPage==='clientes'">
            <button class="btn btn-primary" @click="openModal('novoCliente')">+ Novo Cliente</button>
          </template>
          <template v-if="currentPage==='projetos'">
            <button class="btn btn-ghost btn-sm" @click="openModal('novaTarefa')">+ Nova Tarefa</button>
          </template>
          <template v-if="currentPage==='diagnostico'">
            <button class="btn btn-primary" @click="openModal('novoDiagnostico')">+ Diagnóstico</button>
          </template>
          <template v-if="currentPage==='admin'">
            <button class="btn btn-ghost btn-sm" @click="refreshAdminConsole">Atualizar Console</button>
          </template>
          <button class="btn btn-ghost btn-sm" @click="toggleTheme">{{ currentTheme==='dark' ? '☀️ Claro' : '🌙 Escuro' }}</button>
          <button class="btn btn-ghost btn-sm" @click="doLogout">Sair</button>
        </div>
      </div>

      <!-- CONTENT -->
      <div class="content">

        <!-- =========== DASHBOARD =========== -->
        <div v-if="currentPage==='dashboard'">
          <div class="section-tag">📊 Governança</div>
          <div class="page-title">Dashboard Central</div>
          <div class="page-sub">Visão executiva do seu portfólio de clientes · Atualizado agora</div>

          <div class="kpi-grid">
            <div class="kpi-card accent">
              <div class="kpi-icon">🏢</div>
              <div class="kpi-label">Clientes Ativos</div>
              <div class="kpi-value">{{ kpis.clientesAtivos }}</div>
              <div class="kpi-delta up">↑ 2 este mês</div>
            </div>
            <div class="kpi-card teal">
              <div class="kpi-icon">📈</div>
              <div class="kpi-label">ROI Médio</div>
              <div class="kpi-value">{{ kpis.roiMedio }}%</div>
              <div class="kpi-delta up">↑ 4.2pp vs trimestre</div>
            </div>
            <div class="kpi-card amber">
              <div class="kpi-icon">✅</div>
              <div class="kpi-label">Tarefas Concluídas</div>
              <div class="kpi-value">{{ kpis.tarefasConcluidas }}</div>
              <div class="kpi-delta up">↑ 12 esta semana</div>
            </div>
            <div class="kpi-card emerald">
              <div class="kpi-icon">💰</div>
              <div class="kpi-label">Receita Mensal</div>
              <div class="kpi-value">R${{ kpis.receita }}</div>
              <div class="kpi-delta up">↑ R$1.5k vs mês ant.</div>
            </div>
          </div>

          <div class="charts-grid">
            <div class="card">
              <div class="card-header">
                <div class="card-title"><span class="card-icon">🕸️</span> Maturidade Organizacional</div>
                <span style="font-size:11px;color:var(--text-muted);">Média do portfólio</span>
              </div>
              <div class="chart-box"><canvas id="radarChart"></canvas></div>
            </div>
            <div class="card">
              <div class="card-header">
                <div class="card-title"><span class="card-icon">📊</span> Evolução Mensal</div>
                <span style="font-size:11px;color:var(--text-muted);">Últimos 6 meses</span>
              </div>
              <div class="chart-box"><canvas id="barChart"></canvas></div>
            </div>
          </div>

          <div class="card">
            <div class="card-header">
              <div class="card-title"><span class="card-icon">🏢</span> Portfólio de Clientes</div>
              <button class="btn btn-ghost btn-sm" @click="navigate('clientes')">Ver todos →</button>
            </div>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>Empresa</th>
                    <th>Segmento</th>
                    <th>Maturidade</th>
                    <th>Tarefas</th>
                    <th>Status</th>
                    <th>Ação</th>
                  </tr>
                </thead>
                <tbody>
                  <tr v-for="c in clientes.slice(0,5)" :key="c.uuid">
                    <td style="color:var(--text-primary);font-weight:500;">{{ c.empresa_nome }}</td>
                    <td>{{ c.segmento }}</td>
                    <td>
                      <div style="display:flex;align-items:center;gap:8px;">
                        <div style="width:60px;height:4px;background:rgba(255,255,255,0.06);border-radius:2px;">
                          <div :style="{width:c.maturidade+'%', height:'100%', borderRadius:'2px', background:'linear-gradient(90deg,var(--accent),var(--accent-2))'}"></div>
                        </div>
                        <span style="font-size:11px;color:var(--text-muted);">{{ c.maturidade }}%</span>
                      </div>
                    </td>
                    <td>{{ c.tarefas_abertas }} abertas</td>
                    <td><span class="status-badge" :class="'status-'+c.status">{{ c.status }}</span></td>
                    <td>
                      <button class="btn btn-ghost btn-sm" @click="selectCliente(c)">Abrir</button>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>

        <!-- =========== CLIENTES =========== -->
        <div v-if="currentPage==='clientes'">
          <div class="section-tag">🏢 CRM</div>
          <div class="page-title">Gestão de Clientes</div>
          <div class="page-sub">{{ clientes.length }} empresas no portfólio · Multi-tenant isolado</div>

          <div class="section-grid three-col" style="margin-bottom:20px;">
            <div class="kpi-card accent">
              <div class="kpi-label">Total Clientes</div>
              <div class="kpi-value">{{ clientes.length }}</div>
            </div>
            <div class="kpi-card teal">
              <div class="kpi-label">Ativos</div>
              <div class="kpi-value">{{ clientes.filter(c=>c.status==='active').length }}</div>
            </div>
            <div class="kpi-card amber">
              <div class="kpi-label">Em Onboarding</div>
              <div class="kpi-value">{{ clientes.filter(c=>c.status==='pending').length }}</div>
            </div>
          </div>

          <div class="card">
            <div class="card-header">
              <div class="card-title"><span>🔍</span> Buscar Cliente</div>
            </div>
            <input class="form-input" placeholder="Digite o nome ou segmento..." v-model="busca" style="margin-bottom:12px;">
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>Empresa</th>
                    <th>Segmento</th>
                    <th>Responsável</th>
                    <th>Maturidade</th>
                    <th>Mensalidade</th>
                    <th>Status</th>
                    <th>Estado Projeto</th>
                    <th>Ações</th>
                  </tr>
                </thead>
                <tbody>
                  <tr v-for="c in clientesFiltrados" :key="c.uuid">
                    <td>
                      <div style="font-weight:500;color:var(--text-primary);">{{ c.empresa_nome }}</div>
                      <div style="font-size:10px;color:var(--text-muted);">ID: {{ c.uuid }}</div>
                    </td>
                    <td>{{ c.segmento }}</td>
                    <td>{{ c.responsavel }}</td>

createApp({
  setup() {

    const user = ref({ nome: 'Apollo Consultor', email: 'apollo@sae.app', plano: 'Pro', initials: 'AC' });
    const authContext = ref({ tenant_id: '', perfil: 'viewer' });
    const adminTenant = ref({});
    const adminUsers = ref([]);
    const billingInfo = ref({ status: 'active', plano: 'Pro', limites: { max_usuarios: 0, max_clientes: 0 } });
    const configPlanoSaas = ref('Pro');
    const sessionInvalidHandled = ref(false);
    let refreshTarefasInFlight = null;
    let refreshTarefasSeq = 0;

    const clientes = ref([]);
    const tarefas = ref([]);

    const form = ref({ empresa_nome:'', segmento:'Tecnologia', status:'active', responsavel:'', mensalidade:'', obs:'' });
    const formTarefa = ref({ descricao:'', responsavel:'', prazo_iso:'', onde:'', porque:'', como:'', custo:'', indicador:'', cliente_id:'', status:'iniciar', tipo:'Processo' });
    const formDiag = ref({ tipo:'5S', cliente_id:'' });

    const clienteSelecionado = ref(null);

    /* CLIENTES */
    const clientesFiltrados = computed(() =>
      clientes.value.filter(c => !busca.value ||
        c.empresa_nome.toLowerCase().includes(busca.value.toLowerCase()) ||
        c.segmento.toLowerCase().includes(busca.value.toLowerCase())
      )
    );

    function toNumberFromCurrency(value) {
      if (typeof value === 'number') return Number.isFinite(value) ? value : 0;
      if (typeof value !== 'string') return 0;
      const normalized = value.replace(/\./g, '').replace(',', '.').replace(/[^0-9.-]/g, '');
      const parsed = Number(normalized);
      return Number.isFinite(parsed) ? parsed : 0;
    }


    const allowedFeatures = computed(() => {
      const plano = String((user.value && user.value.plano) || 'Pro');
      if (plano === 'Enterprise') return ['dashboard','clientes','diagnostico','projetos','financeiro','portal','relatorios','configuracoes','admin'];
      return ['dashboard','clientes','diagnostico','projetos','financeiro','portal','relatorios','configuracoes'];
    });

    function hasPermission(recurso) {
      const perfil = String((authContext.value && authContext.value.perfil) || 'viewer').toLowerCase();
      const map = {
        owner: ['*'],
        admin: ['*'],
        manager: ['clientes.*','diagnosticos.*','tarefas.*','financeiro.*','dashboard.kpis','dashboard.pipeline','relatorios.gerar','portal.link','auditoria.listar','admin.tenant.obter','admin.tenant.atualizar','admin.usuarios.listar','billing.assinatura.obter','billing.assinatura.alterarPlano','billing.assinatura.status'],
        analyst: ['clientes.listar','diagnosticos.*','tarefas.*','financeiro.listar','dashboard.kpis','dashboard.pipeline','relatorios.gerar','portal.link','admin.usuarios.listar','billing.assinatura.obter','billing.assinatura.status'],
        viewer: ['clientes.listar','diagnosticos.listar','tarefas.listar','financeiro.listar','dashboard.kpis','dashboard.pipeline','relatorios.gerar','portal.link','billing.assinatura.obter']
      };
      const recursos = map[perfil] || map.viewer;
      if (recurso === 'auth.verificar') return true;
      if (recursos.includes('*')) return true;
      if (recursos.includes(recurso)) return true;
      const modulo = recurso.split('.')[0];
      if (recursos.includes(modulo + '.*')) return true;
      return false;
    }

    function canAccessPage(page) {
      const rules = {
        dashboard: 'dashboard.kpis',
        clientes: 'clientes.listar',
        diagnostico: 'diagnosticos.listar',
        projetos: 'tarefas.listar',
        financeiro: 'financeiro.listar',
        portal: 'portal.link',
        relatorios: 'relatorios.gerar',
        configuracoes: 'auth.verificar',
        admin: 'admin.usuarios.listar'
      };
      const featOk = allowedFeatures.value.includes(page);
      return featOk && hasPermission(rules[page] || 'auth.verificar');
    }

    const enterpriseBanner = computed(() => {
      if (!canAccessPage('admin')) {
        return { title: 'Plano/Permissão', message: 'Seu perfil ou plano atual não habilita o Console Administrativo Enterprise.' };
      }
      if (billingInfo.value && String(billingInfo.value.status || '').toLowerCase() !== 'active') {
        return { title: 'Tenant inativo', message: 'O tenant está inativo. Recursos críticos podem ser bloqueados.' };
      }
      return { title: '', message: '' };
    });

    const kpis = computed(() => ({
      clientesAtivos: clientes.value.filter(c => c.status === 'active').length,
      roiMedio: 34.7,
      tarefasConcluidas: tarefas.value.filter(t => t.status === 'concluido').length,
      receita: clientes.value
        .filter(c => c.status === 'active')
        .reduce((a, c) => a + toNumberFromCurrency(c.mensalidade), 0)
        .toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })
    }));


    const authPrimaryButtonLabel = computed(() => {
      if (authMode.value === 'login') return 'Entrar no Sistema';
      if (authMode.value === 'signup') return 'Criar conta e entrar';
      if (authMode.value === 'forgot') return 'Enviar código de recuperação';
      return 'Redefinir senha';
    });

    /* DIAGNÓSTICO */
    const diagnosticos = ref([]);

    const questionario5S = ref([
      { pergunta: 'Os materiais desnecessários são descartados regularmente?', resposta: 0 },
      { pergunta: 'O local de trabalho é mantido limpo e organizado?', resposta: 0 },
      { pergunta: 'Existem padrões visuais de organização implementados?', resposta: 0 },
      { pergunta: 'Os colaboradores seguem os padrões estabelecidos?', resposta: 0 },
      { pergunta: 'Há programas de melhoria contínua ativos?', resposta: 0 },
    ]);

    /* KANBAN */
    const kanbanColunas = [
      { id: 'iniciar', label: 'A Iniciar' },
      { id: 'execucao', label: 'Em Execução' },
      { id: 'validando', label: 'Validando' },
      { id: 'concluido', label: 'Concluído' },
    ];

    function normalizeIdSafe(value) {
      return String(value || '').trim();
    }

    function normalizeTaskStatus(value) {
      const raw = String(value || '').trim().toLowerCase();
      const map = {
        iniciar: 'iniciar',
        inicio: 'iniciar',
        'a iniciar': 'iniciar',
        a_iniciar: 'iniciar',
        execucao: 'execucao',
        execução: 'execucao',
        'em execução': 'execucao',
        em_execucao: 'execucao',
        validando: 'validando',
        validacao: 'validando',
        validação: 'validando',
        concluido: 'concluido',
        concluído: 'concluido',
        deleted: 'deleted',
        excluido: 'deleted',
        excluído: 'deleted'
      };
      return map[raw] || 'iniciar';
    }

    const tarefasPorStatus = (status) => {
      const statusNormalized = normalizeTaskStatus(status);
      const filtroClienteNormalizado = normalizeIdSafe(filtroCliente.value);
      return tarefas.value.filter(t =>
        normalizeTaskStatus(t.status) === statusNormalized &&
        (!filtroClienteNormalizado || normalizeIdSafe(t.cliente_id) === filtroClienteNormalizado)
      );
    };

    const tarefasDoCliente = computed(() =>
      clienteSelecionado.value
        ? tarefas.value.filter(t => t.cliente_id === clienteSelecionado.value.uuid)
        : []
    );

    /* FINANCEIRO */
    const financeiro = ref({ receitaTotal: '0', inadimplente: '0', potencial: '0' });
    const pagamentos = ref([]);

    /* PORTAL */
    const metasCliente = [
      { nome: 'Processos mapeados', progresso: 80, cor: '#6366f1' },
      { nome: 'Treinamentos', progresso: 60, cor: '#14b8a6' },
      { nome: '5S implementado', progresso: 45, cor: '#f59e0b' },
    ];

    /* RELATÓRIOS */
    const tiposRelatorio = [
      { id:'executivo', icon:'📊', nome:'Resumo Executivo', desc:'Visão geral do projeto, KPIs e próximos passos para a diretoria.' },
      { id:'progresso', icon:'📈', nome:'Relatório de Progresso', desc:'Detalhamento das tarefas concluídas e plano de ação atualizado.' },

      { id:'financeiro', icon:'💰', nome:'Relatório Financeiro', desc:'Demonstrativo de investimento e retorno do projeto de consultoria.' },
    ];

      { nome: 'consultores', cols: 'uuid · nome · email · email_hash · senha_hash · reset_token_hash · reset_expira_iso' },

      { nome: 'diagnosticos', cols: 'uuid · cliente_id · tipo_matriz · respostas_json · score' },
      { nome: 'tarefas_5w2h', cols: 'uuid · cliente_id · descricao · responsavel · prazo_iso · status' },
      { nome: 'financeiro', cols: 'uuid · cliente_id · valor_mensalidade · data_vencimento · pago' },
    ];

    let radarChartInst = null;
    let barChartInst = null;
    let diagRadarInst = null;

    function initCharts() {
      nextTick(() => {
        const mediaMaturidade = clientes.value.length
          ? Math.round(clientes.value.reduce(function(acc, c){ return acc + Number(c.maturidade || 0); }, 0) / clientes.value.length)

        // Radar principal
        const rCtx = document.getElementById('radarChart');
        if (rCtx) {
          if (radarChartInst) radarChartInst.destroy();

            type: 'radar',
            data: {
              labels: ['Processos', 'Pessoas', 'Tecnologia', 'Liderança', 'Cultura', 'Resultados'],
              datasets: [{
                label: 'Maturidade Média',
                data: [mediaMaturidade, mediaMaturidade, mediaMaturidade, mediaMaturidade, mediaMaturidade, mediaMaturidade],
                fill: true,
                backgroundColor: 'rgba(99,102,241,0.15)',
                borderColor: '#6366f1',
                pointBackgroundColor: '#8b5cf6',
                pointBorderColor: '#fff',
                pointBorderWidth: 2,
                borderWidth: 2
              }]
            },
            options: {
              responsive: true, maintainAspectRatio: false,
              scales: {
                r: {
                  min: 0, max: 100,
                  ticks: { display: false },
                  grid: { color: 'rgba(255,255,255,0.06)' },
                  angleLines: { color: 'rgba(255,255,255,0.06)' },
                  pointLabels: { color: '#94a3b8', font: { size: 11, family: 'Roboto' } }
                }
              },
              animation: { duration: 0 },
              plugins: { legend: { display: false } }
            }
          });
        }

        // Bar chart
        const bCtx = document.getElementById('barChart');
        if (bCtx) {
          if (barChartInst) barChartInst.destroy();
          barChartInst = new Chart(bCtx, {
            type: 'bar',
            data: {
              labels: ['Out', 'Nov', 'Dez', 'Jan', 'Fev', 'Mar'],

    function hasGasRuntime() {
      return typeof google !== 'undefined' && google.script && google.script.run;

    function createGasClient() {
      const requestInterceptors = [];
      const responseInterceptors = [];
      const errorInterceptors = [];
      const memoryCache = new Map();
      const inFlight = new Map();
      let pending = 0;

      function toggleLoading(delta, silent) {
        if (silent) return;
        pending = Math.max(0, pending + delta);
        loading.value = pending > 0;
      }

      function applyInterceptors(list, value) {
        return list.reduce((acc, fn) => fn(acc) || acc, value);
      }

      function safeJsonParse(raw) {
        if (typeof raw !== 'string') return { ok: true, value: raw };
        const trimmed = raw.trim();
        if (!trimmed) return { ok: false, error: new Error('Resposta vazia da API.') };
        try {
          return { ok: true, value: JSON.parse(trimmed) };
        } catch (err) {
          return { ok: false, error: new Error('Resposta JSON inválida da API.') };
        }
      }

      function waitMs(ms) {
        return new Promise(function(resolve) { setTimeout(resolve, ms); });
      }

      function runRpc(methodName, payload, timeoutMs) {
        return new Promise((resolve, reject) => {
          let done = false;
          const timer = setTimeout(() => {
            if (done) return;
            done = true;
            reject(new Error('Timeout de comunicação com GAS.'));
          }, timeoutMs);

          try {
            let runner = google.script.run
              .withSuccessHandler((res) => {
                if (done) return;
                done = true;
                clearTimeout(timer);
                resolve(res);
              })
              .withFailureHandler((err) => {
                if (done) return;
                done = true;
                clearTimeout(timer);
                reject(err instanceof Error ? err : new Error(String(err)));
              });

            if (payload === undefined) {
              runner[methodName]();
            } else {
              runner[methodName](payload);
            }
          } catch (err) {
            if (done) return;
            done = true;
            clearTimeout(timer);
            reject(err);
          }
        });
      }

      async function call(methodName, payload, options = {}) {
        const cfg = applyInterceptors(requestInterceptors, {
          methodName,
          payload,
          retries: Number(options.retries !== undefined ? options.retries : 2),
          timeoutMs: Number(options.timeoutMs !== undefined ? options.timeoutMs : 20000),
          cacheKey: options.cacheKey || null,
          cacheTtlMs: Number(options.cacheTtlMs !== undefined ? options.cacheTtlMs : 0),
          dedupeKey: options.dedupeKey || null,
          silent: !!options.silent
        });

        if (!hasGasRuntime()) {
          const err = new Error('Google Apps Script indisponível neste ambiente. Faça o deploy via Web App.');
          applyInterceptors(errorInterceptors, err);
          throw err;
        }

        if (cfg.cacheKey) {
          const cached = memoryCache.get(cfg.cacheKey);
          if (cached && cached.expiresAt > Date.now()) {
            return cached.value;
          }
        }

        if (cfg.dedupeKey && inFlight.has(cfg.dedupeKey)) {
          return inFlight.get(cfg.dedupeKey);
        }

        const execPromise = (async function() {
          toggleLoading(1, cfg.silent);
          let attempt = 0;
          try {
            while (attempt <= cfg.retries) {
              try {
                const result = await runRpc(cfg.methodName, cfg.payload, cfg.timeoutMs);
                const parsed = safeJsonParse(result);
                if (!parsed.ok) throw parsed.error;

                const finalResult = applyInterceptors(responseInterceptors, parsed.value);
                if (cfg.cacheKey && cfg.cacheTtlMs > 0) {
                  memoryCache.set(cfg.cacheKey, { value: finalResult, expiresAt: Date.now() + cfg.cacheTtlMs });
                }
                return finalResult;
              } catch (err) {
                attempt += 1;
                if (attempt > cfg.retries) {
                  applyInterceptors(errorInterceptors, err);
                  throw err;
                }
                const backoff = Math.min(2000, 300 * Math.pow(2, attempt - 1));
                await waitMs(backoff);
              }
            }
          } finally {
            toggleLoading(-1, cfg.silent);
          }
        })();

        if (cfg.dedupeKey) {
          inFlight.set(cfg.dedupeKey, execPromise);
          execPromise.finally(function() {
            if (inFlight.get(cfg.dedupeKey) === execPromise) inFlight.delete(cfg.dedupeKey);
          });
        }

        return execPromise;
      }

      return {
        call,
        api(params, options = {}) {
          return call('api', params, options);
        },
        onRequest(fn) { requestInterceptors.push(fn); },
        onResponse(fn) { responseInterceptors.push(fn); },
        onError(fn) { errorInterceptors.push(fn); },
        clearCache() { memoryCache.clear(); },
        invalidateCacheByPrefix(prefix) {
          const p = String(prefix || '');
          if (!p) return;
          Array.from(memoryCache.keys()).forEach(function(k) {
            if (String(k).indexOf(p) === 0) memoryCache.delete(k);
          });
        }
      };
    }

    const gasClient = createGasClient();
    gasClient.onResponse((res) => {
      if (!res) return res;
      if (typeof res === 'object' && res.request_id) {
        window.__lastRequestId = res.request_id;
      }
      return res;
    });
    gasClient.onError((err) => {
      const rid = window.__lastRequestId || 'n/a';
      console.error('GAS RPC error:', err && err.message ? err.message : err, 'request_id=', rid);
      return err;
    });

    function apiCall(modulo, acao, dados = {}, options = {}) {
      const isPublic = !!options.public;
      const token = options.token !== undefined ? options.token : sessionToken.value;
      if (!isPublic && !normalizeIdSafe(token)) {
        return Promise.reject(new Error('Acesso negado: Token de sessão ausente.'));
      }
      return gasClient.api(
        { modulo: modulo, acao: acao, token: token, dados: dados },
        {
          retries: options.retries !== undefined ? options.retries : 1,
          timeoutMs: options.timeoutMs || 20000,
          silent: !!options.silent,
          cacheKey: options.cacheKey || null,
          cacheTtlMs: options.cacheTtlMs || 0,
          dedupeKey: options.dedupeKey || null
        }
      ).then(function(res) {
        if (!res) throw new Error('Resposta vazia da API.');
        if (res.sucesso === false) {
          const err = new Error(res.erro || 'Falha na API.');
          err.code = res.codigo || 'business_error';
          err.api = res;
          throw err;
        }
        const dadosMerge = (res && res.dados && typeof res.dados === 'object') ? res.dados : {};
        return Object.assign({}, res, dadosMerge);
      });
    }

    function classifyError(err) {
      const msg = String((err && err.message) || err || '');
      const lower = msg.toLowerCase();
      if (lower.indexOf('timeout de comunicação com gas') >= 0 || lower.indexOf('resposta vazia da api') >= 0 || lower.indexOf('resposta json inválida') >= 0) {
        return { tipo: 'tecnico', mensagem: 'Instabilidade de comunicação com o servidor. Tente novamente em instantes.' };
      }
      return { tipo: 'negocio', mensagem: msg || 'Não foi possível concluir a operação.' };
    }

    function notifyOperationError(err, ctxLabel) {
      const parsed = classifyError(err);
      const prefix = parsed.tipo === 'tecnico' ? '[Erro técnico]' : '[Regra de negócio]';
      notify(prefix + ' ' + (ctxLabel ? (ctxLabel + ': ') : '') + parsed.mensagem, parsed.tipo === 'tecnico' ? 'info' : 'error');
    }

    function notify(msg, tipo) {
      const id = String(Date.now()) + '_' + String(Math.random()).slice(2, 8);
      toasts.value.push({ id: id, msg: msg, tipo: tipo || 'info' });
      setTimeout(function() {
        toasts.value = toasts.value.filter(function(t) { return t.id !== id; });
      }, 3200);
    }

    function notifyModal(title, message) {
      systemModal.value = { open: true, title: title || 'Aviso', message: message || '' };
    }

    function closeSystemModal() {
      systemModal.value.open = false;
    }

    function isSessionInvalidError(err) {
      const msg = String((err && err.message) || err || '').toLowerCase();
      return msg.indexOf('sessão inválida') >= 0 || msg.indexOf('session_invalid') >= 0;
    }

    function handleSessionInvalid(err) {
      if (!isSessionInvalidError(err)) return false;
      if (sessionInvalidHandled.value) return true;
      sessionInvalidHandled.value = true;
      notify('Sua sessão expirou ou ficou inconsistente. Faça login novamente.', 'error');
      doLogout();
      return true;
    }

    async function carregarDadosIniciais() {
      if (!sessionToken.value) return;
      const token = sessionToken.value;

      await refreshClientes(token, true);

      const resultados = await Promise.allSettled([
        refreshDashboard(token, true),
        refreshTarefas(token, true),
        refreshDiagnosticos(token, true),
        refreshFinanceiro(token, true)
      ]);

      const falhas = resultados.filter(function(r) { return r.status === 'rejected'; });
      if (falhas.length) {
        console.warn('[carregarDadosIniciais] falhas parciais:', falhas.map(function(f) { return f.reason && f.reason.message ? f.reason.message : String(f.reason); }));
        const falhaSessao = falhas.find(function(f) { return isSessionInvalidError(f.reason); });
        if (falhaSessao) handleSessionInvalid(falhaSessao.reason);
      }
    }

    function refreshDashboard(token, silent) {
      const t = token || sessionToken.value;
      if (!t) return Promise.resolve();
      return apiCall('dashboard', 'kpis', {}, {
        token: t,
        retries: 1,
        silent: !!silent,
        dedupeKey: 'dashboard:kpis:' + t,
        cacheKey: 'dashboard:kpis:' + t,
        cacheTtlMs: 4000
      })
        .then(function(kpiRes) {
          if (kpiRes && kpiRes.sucesso && kpiRes.kpis) {
            financeiro.value = {
              receitaTotal: String(kpiRes.kpis.receitaMensal || '0'),
              inadimplente: financeiro.value.inadimplente,
              potencial: String(kpiRes.kpis.receitaMensal || '0')
            };
          }
        })
        .catch(function(err) {
          if (!handleSessionInvalid(err)) console.error('[refreshDashboard] erro:', err);
          throw err;
        });
    }

    function unwrapApiList(res, key, opts = {}) {
      const strict = opts.strict !== false;
      if (!res) {
        if (!strict) return [];
        throw new Error('Resposta vazia da API.');
      }
      if (res.sucesso === false) {
        throw new Error(res.erro || ('Falha ao carregar ' + key));
      }
      if (Array.isArray(res[key])) {
        return res[key];
      }
      if (res.dados && Array.isArray(res.dados[key])) {
        return res.dados[key];
      }
      return [];
    }

    function refreshClientes(token, silent, forceFresh) {
      const t = token || sessionToken.value;
      if (!t) return Promise.resolve();
      return apiCall('clientes', 'listar', { page: 1, pageSize: LIST_PAGE_SIZE, no_cache: !!forceFresh }, {
        token: t,
        retries: 1,
        silent: !!silent,
        dedupeKey: 'clientes:listar:' + t,
        cacheKey: forceFresh ? null : ('clientes:listar:' + t),
        cacheTtlMs: forceFresh ? 0 : 4000
      })
        .then(function(res) {
          if (!res) throw new Error('Resposta vazia ao listar clientes.');
          if (res.sucesso === false) throw new Error(res.erro || 'Falha ao listar clientes.');

          const incoming =
            (Array.isArray(res.clientes) && res.clientes) ||
            (res.dados && Array.isArray(res.dados.clientes) && res.dados.clientes) ||
            [];
          clientes.value = incoming.map(function(c) {
            return Object.assign({}, c, { uuid: c.uuid || c.id || '' });
          });

          if (!normalizeIdSafe(formDiag.value.cliente_id) && clientes.value.length) {
            formDiag.value.cliente_id = normalizeIdSafe(clienteSelecionado.value && clienteSelecionado.value.uuid) || normalizeIdSafe(clientes.value[0].uuid);
          }
          console.log('[refreshClientes] clientes carregados:', clientes.value.length);
        })
        .catch(function(err) {
          if (!handleSessionInvalid(err)) console.error('[refreshClientes] erro:', err);
          throw err;
        });
    }

    function refreshTarefas(token, silent, forceFresh) {
      const t = token || sessionToken.value;
      if (!t) return Promise.resolve();
      console.log('[refreshTarefas] token?', !!t, 'clienteFiltro=', filtroCliente.value);
      const payload = { modulo: 'tarefas', acao: 'listar', token: t, dados: { page: 1, pageSize: LIST_PAGE_SIZE, no_cache: !!forceFresh } };
      if (refreshTarefasInFlight) return refreshTarefasInFlight;
      const seq = ++refreshTarefasSeq;
      refreshTarefasInFlight = apiCall(payload.modulo, payload.acao, payload.dados, {
        token: payload.token,
        retries: 1,
        silent: !!silent,
        dedupeKey: 'tarefas:listar:' + (payload.token || ''),
        cacheKey: forceFresh ? null : ('tarefas:listar:' + (payload.token || '')),
        cacheTtlMs: forceFresh ? 0 : 4000
      })
        .then(function(res) {
          if (seq !== refreshTarefasSeq) return;
          console.log('[refreshTarefas] resposta bruta:', res);
          const incoming = unwrapApiList(res, 'tarefas');
          tarefas.value = incoming.map(function(task) {
            return {
              ...task,
              uuid: task.uuid || task.id || '',
              status: normalizeTaskStatus(task.status),
              cliente_id: normalizeIdSafe(task.cliente_id)
            };
          });
          console.log('[refreshTarefas] tarefas carregadas:', tarefas.value.length);
        })
        .catch(function(err) {
          if (!handleSessionInvalid(err)) console.error('[refreshTarefas] erro:', err);
          throw err;
        })
        .finally(function() {
          if (refreshTarefasInFlight) refreshTarefasInFlight = null;
        });
      return refreshTarefasInFlight;
    }

    function refreshAdminConsole() {
      const t = sessionToken.value;
      if (!t) return Promise.resolve();
      if (!canAccessPage('admin')) return refreshBillingInfo(t, true);
      return Promise.allSettled([
        gasClient.api({ modulo: 'admin', acao: 'tenant.obter', token: t, api_version: 'v2', dados: {} }, { retries: 0, silent: true }),
        gasClient.api({ modulo: 'admin', acao: 'usuarios.listar', token: t, api_version: 'v2', dados: {} }, { retries: 0, silent: true }),
        gasClient.api({ modulo: 'billing', acao: 'assinatura.status', token: t, api_version: 'v2', dados: {} }, { retries: 0, silent: true })
      ]).then(function(results) {
        const tRes = results[0].status === 'fulfilled' ? results[0].value : null;
        const uRes = results[1].status === 'fulfilled' ? results[1].value : null;
        const bRes = results[2].status === 'fulfilled' ? results[2].value : null;

        if (tRes && tRes.sucesso) adminTenant.value = (tRes.dados && tRes.dados.tenant) || tRes.tenant || {};
        if (uRes && uRes.sucesso) adminUsers.value = (uRes.dados && uRes.dados.usuarios) || uRes.usuarios || [];
        if (bRes && bRes.sucesso) {
          billingInfo.value = (bRes.dados || bRes);
          if (billingInfo.value && billingInfo.value.plano) {
            configPlanoSaas.value = billingInfo.value.plano;
            user.value.plano = billingInfo.value.plano;
          }
        }
      }).catch(function(err) {
        console.error('[refreshAdminConsole]', err);
      });
    }

    function salvarPlanoSaas() {
      if (!sessionToken.value) {
        notify('Faça login para alterar o plano.', 'info');
        return;
      }
      loading.value = true;
      apiCall('billing', 'assinatura.alterarPlano', { plano: configPlanoSaas.value }, { retries: 0, timeoutMs: 20000 })
        .then(function(res) {
          if (!res || res.sucesso === false) {
            const err = new Error((res && res.erro) || 'Falha ao alterar plano.');
            err.code = (res && res.codigo) || 'business_error';
            throw err;
          }
          gasClient.invalidateCacheByPrefix('dashboard:kpis:');
          return Promise.allSettled([
            refreshAdminConsole(),
            refreshDashboard(sessionToken.value, true)
          ]);
        })
        .then(function() {

    async function requestPasswordReset() {
      if (!resetEmail.value) {
        loginError.value = 'Informe seu e-mail para recuperar a senha.';
        return;
      }
      loading.value = true;
      loginError.value = '';
      try {
        const res = await apiCall('auth', 'solicitarReset', { email: resetEmail.value }, { retries: 0, timeoutMs: 20000, public: true });
        if (!res || !res.sucesso) {
          loginError.value = (res && res.erro) || 'Não foi possível enviar o código de recuperação.';
          return;
        }
        notify((res && res.dados && res.dados.mensagem) || 'Instruções enviadas por e-mail.', 'success');
        authMode.value = 'reset';
      } catch (err) {
        loginError.value = (err && err.message) || 'Erro ao solicitar recuperação de senha.';
      } finally {
        loading.value = false;
      }
    }

    async function confirmPasswordReset() {
      if (!resetToken.value || !resetPass.value || !resetPassConfirm.value) {
        loginError.value = 'Preencha código, nova senha e confirmação.';
        return;
      }
      if (resetPass.value !== resetPassConfirm.value) {
        loginError.value = 'A confirmação da senha não confere.';
        return;
      }
      loading.value = true;
      loginError.value = '';
      try {
        const res = await apiCall('auth', 'redefinirSenha', { token: resetToken.value, novaSenha: resetPass.value }, { retries: 0, timeoutMs: 20000, public: true });
        if (!res || !res.sucesso) {
          loginError.value = (res && res.erro) || 'Não foi possível redefinir a senha.';
          return;
        }
        notify((res && res.dados && res.dados.mensagem) || 'Senha redefinida com sucesso.', 'success');
        resetPass.value = '';
        resetPassConfirm.value = '';
        resetToken.value = '';
        authMode.value = 'login';
      } catch (err) {
        loginError.value = (err && err.message) || 'Erro ao redefinir senha.';
      } finally {
        loading.value = false;
      }
    }

    /* AUTH */
    async function doLogin() {
      if (!loginEmail.value || !loginPass.value) {
        loginError.value = 'Preencha todos os campos'; return;
      }

      loading.value = true;
      loginError.value = '';
      showSetupAction.value = false;

      try {
        const res = await gasClient.call('autenticarConsultor', { email: loginEmail.value, senha: loginPass.value }, { retries: 1, timeoutMs: 20000 });
        if (!res || !res.sucesso) {
          const erroMsg = (res && res.erro) || 'Falha ao autenticar. Verifique seus dados.';
          showSetupAction.value = /Aba obrigatória não encontrada|setupSpreadsheet/i.test(erroMsg);
          setAuthState('error', erroMsg);
          return;
        }

        sessionToken.value = res.token || '';
        try { sessionStorage.setItem('sae_token', sessionToken.value); } catch (err) {}
        try { localStorage.setItem('sae_token', sessionToken.value); } catch (err) {}
        if (res.consultor) {
          authContext.value = {
            tenant_id: res.consultor.tenant_id || '',
            perfil: res.consultor.perfil || 'viewer'
          };
          user.value = {
            nome: res.consultor.nome || user.value.nome,
            email: res.consultor.email || loginEmail.value,
            plano: res.consultor.plano || user.value.plano,
            initials: (res.consultor.nome || 'A').split(' ').map(n => n[0]).slice(0,2).join('').toUpperCase()
          };
        }

        setAuthState('authenticated');
        await carregarDadosIniciais();

        const authCheck = await apiCall('auth', 'verificar', {}, { token: sessionToken.value, retries: 0, timeoutMs: 15000, silent: true, public: true });
        if (!authCheck || authCheck.sucesso === false || !authCheck.consultor_id) {
          throw new Error((authCheck && authCheck.erro) || 'Sessão inválida');
        }

        await refreshAdminConsole();
        if (billingInfo.value && billingInfo.value.plano) {
          user.value.plano = billingInfo.value.plano;
          configPlanoSaas.value = billingInfo.value.plano;
        }
        console.log('[doLogin] token recebido:', !!sessionToken.value);
        console.log('[doLogin] clientes carregados:', clientes.value.length);
        console.log('[doLogin] tarefas carregadas:', tarefas.value.length);
        console.log('[doLogin] diagnosticos carregados:', diagnosticos.value.length);
        console.log('[doLogin] pagamentos carregados:', pagamentos.value.length);
        setTimeout(initCharts, 300);
      } catch (err) {
        const msg = (err && err.message) || String(err) || 'Erro ao conectar com backend GAS.';
        showSetupAction.value = /setupSpreadsheet|Aba obrigatória/i.test(msg);
        setAuthState('error', msg);
      } finally {
        loading.value = false;
      }
    }

    function triggerPdfDownload(base64, fileName) {
      try {
        const bytes = atob(base64 || '');
        const len = bytes.length;
        const arr = new Uint8Array(len);
        for (let i = 0; i < len; i++) arr[i] = bytes.charCodeAt(i);
        const blob = new Blob([arr], { type: 'application/pdf' });
        const objectUrl = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = objectUrl;
        link.download = fileName || ('relatorio_' + new Date().getTime() + '.pdf');
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        setTimeout(function(){ URL.revokeObjectURL(objectUrl); }, 1500);
        return true;
      } catch (err) {
        return false;
      }
    }

    function gerarRelatorio() {
      if (!clienteSelecionado.value || !clienteSelecionado.value.uuid) {

      loading.value = true;
      apiCall('relatorios', 'gerar', { cliente_id: clienteSelecionado.value.uuid, tipo: 'executivo' }, { retries: 0 })
        .then(function(res){
          if (!res || !res.sucesso) throw new Error((res && res.erro) || 'Falha ao gerar relatório');
          if (res.base64_pdf) {
            const ok = triggerPdfDownload(res.base64_pdf, res.file_name || 'relatorio_sae.pdf');
            if (ok) {
              notify('Relatório PDF baixado com sucesso.', 'success');
            } else if (res.url) {
              window.open(res.url, '_blank');
              notify('Relatório gerado. Fallback por link de download.', 'info');
            }
          } else if (res.url) {
            window.open(res.url, '_blank');
            notify('Relatório gerado e enviado para download.', 'success');
          } else if (res.html) {
            var win = window.open('', '_blank');
            if (win) {
              win.document.write(res.html);
              win.document.close();
              notify('Relatório HTML aberto em nova aba.', 'info');
            } else {
              notifyModal('Pop-up bloqueado', 'Permita pop-ups para este domínio para concluir o download do relatório.');
            }
          }
        })
        .catch(function(err){ notifyOperationError(err, 'gerar relatório'); })
        .finally(function(){ loading.value = false; });
    }
