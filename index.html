          notify('Relatório "' + r.nome + '" gerado com sucesso.', 'success');
        })
        .catch(function(err){ notifyOperationError(err, 'gerar relatório ' + (r && r.nome ? r.nome : '')); })
        .finally(function(){ loading.value = false; });
    }

    async function runSetup() {
      loading.value = true;
      try {
        const res = await apiCall('setup', 'executar', {}, { retries: 0, timeoutMs: 30000, public: true });
        if (!res || !res.sucesso) {
          const err = new Error((res && res.erro) || 'Falha ao executar setup.');
          err.code = (res && res.codigo) || 'business_error';
          notifyOperationError(err, 'executar setup');
          return;
        }
        showSetupAction.value = false;
        setAuthState('unauthenticated', 'Setup concluído. Faça login para continuar.');
      } catch (err) {
        notify('Erro ao executar setup: ' + ((err && err.message) || err), 'error');
      } finally {
        loading.value = false;
      }
    }

    /* HELPERS */
    function formatDate(iso) {
      if (!iso) return '—';
      const texto = String(iso).trim();
      let d = new Date(texto);
      if (Number.isNaN(d.getTime()) && /^\d{4}-\d{2}-\d{2}$/.test(texto)) {
        d = new Date(texto + 'T00:00:00');
      }
      if (Number.isNaN(d.getTime())) return '—';
      return d.toLocaleDateString('pt-BR', { timeZone: 'UTC' });
    }

    function isOverdue(iso) {
      if (!iso) return false;
      return new Date(iso) < new Date();
    }

    function campos5W2H(t) {
      return [
        { label: '🔴 O QUE (What)', valor: t.descricao },
        { label: '👤 QUEM (Who)', valor: t.responsavel },
        { label: '📅 QUANDO (When)', valor: formatDate(t.prazo_iso) },
        { label: '📍 ONDE (Where)', valor: t.onde },
        { label: '❓ POR QUÊ (Why)', valor: t.porque },
        { label: '⚙️ COMO (How)', valor: t.como },
        { label: '💰 QUANTO CUSTA', valor: t.custo },
        { label: '📊 COMO MEDIR', valor: t.indicador },
      ];
    }

    onMounted(async () => {
      try {
        const savedTheme = localStorage.getItem('sae_theme');
        applyTheme(savedTheme || 'dark');
      } catch (err) {
        applyTheme('dark');
      }

      try {
        const params = new URLSearchParams(window.location.search || '');
        const modeParam = params.get('mode');
        const tokenParam = params.get('token');
        if (modeParam === 'reset') {
          authMode.value = 'reset';
          if (tokenParam) resetToken.value = tokenParam;
        }
      } catch (err) {}

      setAuthState('booting');

      if (!hasGasRuntime()) {
        setAuthState('error', 'Ambiente local detectado. Abra o sistema pelo Web App do Google Apps Script.');
        return;
      }

      try {
        const res = await apiCall('setup', 'validarSchema', {}, { retries: 0, public: true, silent: true });
        if (!res || !res.sucesso || !res.dados || !res.dados.ok) {
          showSetupAction.value = true;
          const detalhes = (res && res.dados && res.dados.detalhes && res.dados.detalhes.length) ? ' Pendências: ' + res.dados.detalhes.map(function(d){ return d.aba + ' (' + d.status + ')'; }).join(', ') : '';
          setAuthState('error', 'Estrutura de banco incompleta. Execute setupSpreadsheet().' + detalhes);
          return;
        }
      } catch (err) {
        setAuthState('error', 'Não foi possível validar schema: ' + ((err && err.message) || err));
        return;
      }

      try {
        const savedToken = sessionStorage.getItem('sae_token') || localStorage.getItem('sae_token');
        if (savedToken) {
          sessionToken.value = savedToken;
          const authRes = await apiCall('auth', 'verificar', {}, { token: savedToken, retries: 0, timeoutMs: 15000, public: true, silent: true });
          if (authRes && authRes.sucesso && authRes.consultor_id) {
            authContext.value = { tenant_id: authRes.tenant_id || '', perfil: authRes.perfil || 'viewer' };
            await refreshAdminConsole();
            if (billingInfo.value && billingInfo.value.plano) {
              user.value.plano = billingInfo.value.plano;
              configPlanoSaas.value = billingInfo.value.plano;
            }
            setAuthState('authenticated');
            await carregarDadosIniciais();
            setTimeout(initCharts, 300);
            return;
          }
          sessionStorage.removeItem('sae_token');
          localStorage.removeItem('sae_token');
        }
      } catch (err) {
        console.error('[boot auth restore]', err);
      }

      setAuthState('unauthenticated');
    });

    return {
      loading, appState, authenticated, showSetupAction, authMode, sessionToken,
      loginEmail, loginPass, signupNome, signupEmail, signupPass, loginError,
      resetEmail, resetToken, resetPass, resetPassConfirm,
      currentTheme, authPrimaryButtonLabel,
      currentPage, pageTitle, modal, busca, diagTab, filtroCliente,
      portalClienteId, linkPortal, showPortalPreview, tarefaSelecionada, toasts, systemModal,
      user, authContext, adminTenant, adminUsers, billingInfo, allowedFeatures, enterpriseBanner, clientes, tarefas, form, formTarefa, formDiag,
      configPlanoSaas,
      clienteSelecionado, clientesFiltrados, kpis, diagnosticos,
      questionario5S, kanbanColunas, tarefasPorStatus, tarefasDoCliente,
      financeiro, pagamentos, metasCliente, tiposRelatorio, sheetsConfig,
      navigate, canAccessPage, refreshAdminConsole, selectCliente, doLogin, doSignup, doLogout,
      submitAuth, requestPasswordReset, confirmPasswordReset, toggleTheme,
      openModal, closeModal,
      salvarCliente, editarCliente, inativarCliente, salvarTarefa, atualizarTarefa, excluirTarefa,
      salvarPlanoSaas,
      salvarDiagnostico, criarDiagnostico, marcarPago,
      gerarLinkPortal, verPreviewPortal, gerarRelatorio,
      gerarRelatorioTipo, runSetup, notifyModal, closeSystemModal,
      formatDate, isOverdue, campos5W2H
    };
  }
}).mount('#app');
</script>
</body>
</html>
